[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aigov"
version = "2.0.0"
description = "AI governance kit: framework-mapped AI controls, AI risk scoring and EU AI Act tier screening"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-NC-4.0" }
authors = [{ name = "Olga Arkadieva" }]
keywords = ["ai-governance", "nist-ai-rmf", "iso-42001", "eu-ai-act", "ai-agents"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://smartailayer.com"
"Notion template" = "https://smartailayer.notion.site/AI-Governance-Starter-Kit-3f0e47a9275080e480efd72a57a9442d"

[tool.setuptools]
packages = ["aigov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
